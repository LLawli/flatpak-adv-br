[package]
name = "ancora"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
description = "Central de certificados: publica tokens e assinadores instalados como extensões Flatpak para os navegadores e aplicativos do sistema"
license = "GPL-3.0-only"
publish = false

[dependencies]
gtk = { package = "gtk4", version = "0.11", features = ["v4_18"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_7"] }
serde = { version = "1", features = ["derive"] }
toml = "1"
cryptoki = "0.12"
# Só para listar os slots sem o laço do cryptoki (ver `sonda::slots_com_token`).
cryptoki-sys = "0.5"
libc = "0.2"
glib-unix = "0.22"
libloading = "0.8"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
strip = true
