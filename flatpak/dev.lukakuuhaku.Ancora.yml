id: dev.lukakuuhaku.Ancora
runtime: org.gnome.Platform
runtime-version: '51'
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: ancora

finish-args:
  - --share=ipc
  - --socket=wayland
  # x11 de verdade, e não fallback-x11: os assinadores Lacuna e Softplan são
  # Avalonia, que só desenha por X11, e rodam neste sandbox quando o navegador
  # é nativo. fallback-x11 só entrega o X11 quando não há Wayland, e eles
  # morrem com "XOpenDisplay failed".
  - --socket=x11
  - --device=dri
  # As leitoras de smartcard, pelo pcscd do host.
  - --socket=pcsc
  # Rede: os drivers rodam no serviço do Âncora, e alguns falam com o
  # fabricante durante a assinatura (o da Certisign, por exemplo). Uma extensão
  # não acrescenta permissões ao sandbox, então a rede tem de estar aqui: sem
  # ela, toda assinatura real com esses drivers falha.
  - --share=network
  # Os sockets dos servidores de cada driver: $XDG_RUNTIME_DIR/ancora/<driver>.
  - --filesystem=xdg-run/ancora:create
  # Onde o p11-kit do host procura os módulos do usuário. Só os arquivos
  # ancora-*.module são escritos ou apagados.
  - --filesystem=xdg-config/pkcs11:create
  # Rodar comandos no host: listar os aplicativos instalados, ligar o
  # p11-kit-server.socket do usuário, achar onde uma extensão está instalada e,
  # na tela de extensões, instalar e atualizar extensões. É a permissão que o
  # Flathub marca como saída do sandbox, aceita de propósito
  # (docs/arquitetura.md).
  - --talk-name=org.freedesktop.Flatpak
  # O socket do p11-kit-server.socket do usuário: conferir de ponta a ponta o
  # que os aplicativos enxergam, e o caminho dos assinadores até os tokens.
  - --filesystem=xdg-run/p11-kit/pkcs11
  # Dar permissões a outros aplicativos, e tirar só as que o Âncora deu.
  - --filesystem=xdg-data/flatpak/overrides:create
  # Os lançadores dos assinadores para os navegadores nativos.
  - --filesystem=xdg-data/ancora:create
  # Os navegadores e leitores de PDF em Flatpak: bancos NSS
  # (src/aplicativos.rs) e manifestos de native messaging (src/assinadores.rs).
  # Sem :create: a pasta existe quando o aplicativo está instalado e já foi
  # aberto, e o Âncora não cria pastas de quem não está.
  - --filesystem=~/.var/app/org.mozilla.firefox
  - --filesystem=~/.var/app/org.chromium.Chromium
  - --filesystem=~/.var/app/com.google.Chrome
  - --filesystem=~/.var/app/com.microsoft.Edge
  - --filesystem=~/.var/app/com.brave.Browser
  - --filesystem=~/.var/app/org.gnome.Papers/config/mozilla:create
  - --filesystem=~/.var/app/org.kde.okular/config/mozilla:create
  # Os navegadores nativos: bancos NSS (src/nativos.rs) e manifestos de native
  # messaging. ~/.pki/nssdb é o banco antigo dos derivados do Chromium,
  # ~/.local/share/pki/nssdb o novo.
  - --filesystem=~/.pki/nssdb
  - --filesystem=~/.local/share/pki/nssdb
  - --filesystem=~/.mozilla
  - --filesystem=~/.config/mozilla
  - --filesystem=~/.config/google-chrome
  - --filesystem=~/.config/chromium
  - --filesystem=~/.config/BraveSoftware
  - --filesystem=~/.config/microsoft-edge
  - --filesystem=~/.config/vivaldi
  - --filesystem=~/.config/opera

build-options:
  append-path: /usr/lib/sdk/rust-stable/bin

# Cada família de extensão é um ponto de extensão, montado em
# /app/extensoes/<família>/<Nome>, com o ancora.toml na raiz (ver
# docs/extensoes.md). no-autodownload: instalar o Âncora não instala extensão
# nenhuma; quem escolhe é a pessoa, pela tela de extensões. autodelete: elas
# só servem ao Âncora e saem junto com ele.
add-extensions:
  dev.lukakuuhaku.Ancora.Driver:
    directory: extensoes/driver
    subdirectories: true
    no-autodownload: true
    autodelete: true
    version: master
  dev.lukakuuhaku.Ancora.Assinador:
    directory: extensoes/assinador
    subdirectories: true
    no-autodownload: true
    autodelete: true
    version: master
  dev.lukakuuhaku.Ancora.App:
    directory: extensoes/app
    subdirectories: true
    no-autodownload: true
    autodelete: true
    version: master

modules:
  # O cliente PC/SC, que todo driver de token usa (libpcsclite.so.1) e que o
  # runtime não traz. O daemon é o do host, alcançado pelo socket que
  # --socket=pcsc monta em /run/pcscd. Fica no aplicativo base, e não em cada
  # extensão, para que todos os drivers falem com a mesma versão.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dlibusb=false
      - -Dpolkit=false
      - -Dserial=false
      - -Dusb=false
      - -Dipcdir=/run/pcscd
    cleanup:
      - /bin
      - /sbin
      - /include
      - /lib/pkgconfig
      - /lib/systemd
      - /share
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.1.tar.xz
        sha256: bfcfe38a20afc49849c6bf55325e38f449fc4b26d3923fdc32b969ae41a8741b

  # O token-sentinela que a verificação publica por alguns segundos (ver
  # src/verificacao.rs).
  - name: sentinela
    buildsystem: simple
    build-commands:
      - gcc -shared -fPIC -O2 -Wall -Wextra -Werror -I/usr/include/p11-kit-1
        sentinela.c -o libancora-sentinela.so
      - install -Dm755 libancora-sentinela.so -t /app/lib/ancora
    sources:
      - type: file
        path: ../sentinela/sentinela.c

  - name: ancora
    buildsystem: simple
    build-options:
      env:
        # O cargo-sources.json descompacta os crates aqui, junto com um
        # config.toml que manda o cargo usá-los em vez do crates.io.
        CARGO_HOME: /run/build/ancora/cargo
    build-commands:
      - cargo --offline build --release --locked
      - install -Dm755 target/release/ancora -t /app/bin
      # O Flatpak só monta extensão onde o diretório já existe no app.
      - install -d /app/extensoes/driver /app/extensoes/assinador /app/extensoes/app
      - install -Dm644 data/dev.lukakuuhaku.Ancora.desktop -t /app/share/applications
      - install -Dm644 data/dev.lukakuuhaku.Ancora.metainfo.xml -t /app/share/metainfo
      - install -Dm644 data/icons/hicolor/scalable/apps/dev.lukakuuhaku.Ancora.svg
        -t /app/share/icons/hicolor/scalable/apps
    sources:
      - type: dir
        path: ..
        skip:
          - target
          - .flatpak-builder
          - build-dir
          - repo
          - .jj
          - .git
          - extensoes
      - cargo-sources.json
