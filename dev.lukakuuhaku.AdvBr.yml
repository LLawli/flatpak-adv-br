# Manifesto do adv-br com interface gráfica.
#
# A diferença para o pacote de linha de comando não é a janela: é o modelo de
# instalação. Aqui os drivers e assinadores NÃO são extensões Flatpak; eles são
# baixados pelo próprio aplicativo, em tempo de execução, para os dados dele em
# ~/.var/app/dev.lukakuuhaku.AdvBr/data/componentes.
#
# O que isso compra:
#
#   - nada de flatpak-builder na máquina de quem instala;
#   - nada da permissão org.freedesktop.Flatpak, que é a que faz o Flathub
#     marcar um aplicativo como inseguro e que impediria a publicação;
#   - instalar um driver vira um clique, e remover é apagar um diretório.
#
# O que isso exige: as bibliotecas de apoio que as extensões compilavam
# precisam vir aqui dentro (o gdbm antigo que o SafeSign quer, por exemplo), e
# um .so baixado precisa carregar de dentro dos dados do app, o que foi
# verificado antes de escrever qualquer linha disto.
#
# A licença dos binários continua sendo a razão de nada vir embutido: cada um é
# baixado da URL do próprio fabricante, na máquina de quem usa, com sha256
# conferido.
id: dev.lukakuuhaku.AdvBr
runtime: org.gnome.Platform
runtime-version: '50'
sdk: org.gnome.Sdk
command: adv-br-ui

finish-args:
  - --socket=wayland
  # x11 de verdade, e não fallback-x11: o Lacuna Web PKI e o Softplan
  # WebSigner são Avalonia, que só tem backend X11. Sob Wayland eles morrem
  # com "XOpenDisplay failed" antes de ler a primeira mensagem, e o
  # fallback-x11 só entrega o socket quando NÃO há Wayland, que é exatamente
  # o caso em que eles não precisariam dele.
  #
  # A janela deste aplicativo é GTK4 e continua nativa no Wayland; o X11 é
  # para os assinadores que ele lança.
  - --socket=x11
  - --share=ipc
  # Baixar os componentes dos sites dos fabricantes.
  - --share=network
  # Leitoras de smartcard pelo pcscd do host, e tokens USB que falam direto.
  - --socket=pcsc
  - --device=all

  # Publicar o token para os programas que já existem na máquina significa
  # escrever arquivo de configuração na home de quem usa. A lista abaixo é o
  # mínimo para isso, caminho por caminho, em vez de --filesystem=home: o que
  # o aplicativo não precisa ler, ele não lê.
  #
  # Se alguma delas for revogada, o aplicativo detecta e mostra o comando para
  # devolvê-la, em vez de falhar sem explicação.
  #
  # Onde o p11-kit do host procura módulos do usuário (autenticação por
  # certificado em qualquer programa que use p11-kit).
  - --filesystem=xdg-config/pkcs11:create
  # Bancos NSS e manifestos de native messaging dos navegadores do host.
  - --filesystem=~/.mozilla:create
  - --filesystem=xdg-config/mozilla:create
  - --filesystem=~/.pki:create
  - --filesystem=xdg-config/google-chrome:create
  - --filesystem=xdg-config/chromium:create
  - --filesystem=xdg-config/BraveSoftware:create
  - --filesystem=xdg-config/vivaldi:create
  - --filesystem=xdg-config/microsoft-edge:create
  - --filesystem=xdg-config/opera:create
  # Os mesmos navegadores, quando são Flatpak. É um caminho amplo, e é o preço
  # de alcançar o sandbox de outro aplicativo: não há portal para isso.
  - --filesystem=~/.var/app
  # Os atalhos no menu de aplicativos.
  - --filesystem=xdg-data/applications:create
  # Atalhos dos assinadores, que o navegador executa.
  - --filesystem=~/.local/bin:create
  # Somente leitura do /usr do host, para descobrir onde está o p11-kit-proxy
  # dele: o caminho muda por distribuição (/usr/lib64 no Fedora,
  # /usr/lib/<triplet> no Debian, /usr/lib no Arch) e é esse caminho que vai
  # gravado no banco NSS.
  #
  # A alternativa seria registrar os três e deixar o NSS descartar os que não
  # existem. Não serve: no Arch /usr/lib64 é link para /usr/lib, os dois
  # existem, e cada token apareceria duas vezes na lista do navegador.
  - --filesystem=host-os:ro

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - /share/doc
  - '*.la'
  - '*.a'

modules:
  # Cliente PC/SC. O daemon é o do host, alcançado pelo socket que --socket=pcsc
  # monta em /run/pcscd.
  - name: pcsc-lite
    buildsystem: meson
    config-opts:
      - -Dlibsystemd=false
      - -Dlibudev=false
      - -Dlibusb=false
      - -Dpolkit=false
      - -Dserial=false
      - -Dusb=false
      - -Dipcdir=/run/pcscd
    cleanup:
      - /bin/pcsc-spy
      - /sbin
      - /share/pcsc
    sources:
      - type: archive
        url: https://pcsclite.apdu.fr/files/pcsc-lite-2.5.1.tar.xz
        sha256: bfcfe38a20afc49849c6bf55325e38f449fc4b26d3923fdc32b969ae41a8741b

  # OpenSC cobre boa parte dos cartões ICP-Brasil sem driver proprietário, e é
  # software livre: é o que faz o aplicativo ser útil assim que instala.
  - name: opensc
    buildsystem: autotools
    config-opts:
      - --disable-static
      - --disable-doc
      - --disable-man
      - --enable-pcsc
    make-install-args:
      - p11kitdir=/app/share/p11-kit/modules
      # O autotools do OpenSC descobre esses diretórios pelo pkg-config e
      # chega em /usr, que pertence ao runtime e é somente leitura. No
      # freedesktop o segundo não aparecia; no GNOME, sim.
      - completiondir=/app/share/bash-completion/completions
    sources:
      - type: archive
        url: https://github.com/OpenSC/OpenSC/releases/download/0.27.1/opensc-0.27.1.tar.gz
        sha256: 976f4a23eaf3397a1a2c3a7aac80bf971a8c3d829c9a79f06145bfaeeae5eca7

  # A libaetpkss.so do SafeSign precisa de libgdbm_compat.so.4, que o runtime
  # não traz: é a interface antiga do gdbm, só existe com --enable-libgdbm-compat.
  # No modelo de extensões isto era compilado junto do driver; aqui, como o
  # driver chega pronto pela rede, a dependência tem de estar no aplicativo.
  - name: gdbm
    buildsystem: autotools
    config-opts:
      - --enable-libgdbm-compat
      - --disable-static
      - --without-readline
    cleanup:
      - /bin
      - /share
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/gdbm/gdbm-1.26.tar.gz
        sha256: 6a24504a14de4a744103dcb936be976df6fbe88ccff26065e54c1c47946f4a5e

  # A única biblioteca PKCS#11 que o PJeOffice carrega. Ver src/pkcs11-shim.c:
  # ele aceita um diretório em PKCS11_DRIVER e carrega dali um "pkcs11.so";
  # este repassa ao p11-kit-proxy do runtime, que responde por todos os drivers
  # registrados de uma vez. São 8 KB no aplicativo base, e é o que permite ao
  # PJeOffice, que chega como componente, enxergar driver instalado depois
  # dele.
  - name: pkcs11-shim
    buildsystem: simple
    build-commands:
      - install -d /app/lib/pkcs11
      - gcc -shared -fPIC -O2 -Wall -Wextra -Werror -o /app/lib/pkcs11/pkcs11.so
        pkcs11-shim.c -ldl
      # Um shim que não exporte o ponto de entrada do PKCS#11 é indistinguível
      # de um driver ausente na hora de assinar, e só apareceria lá.
      - nm -D --defined-only /app/lib/pkcs11/pkcs11.so | grep -q ' T C_GetFunctionList$'
    sources:
      - type: file
        path: src/pkcs11-shim.c

  - name: adv-br-ui
    buildsystem: simple
    build-commands:
      - install -Dm644 -t /app/share/adv-br-ui ui/deb.py ui/catalogo.py
        ui/instalador.py ui/pkcs11.py ui/nssdb.py ui/permissoes.py
        ui/publicador.py ui/janela.py ui/aplicativo.py ui/serie.py ui/registro.py ui/sanitizar.py
        ui/diagnostico.py ui/relator.py ui/escala.py
      - install -Dm755 ui/adv-br-ui /app/bin/adv-br-ui
      - install -Dm755 ui/adv-br-pkcs11 /app/bin/adv-br-pkcs11
      - install -Dm755 ui/adv-br-aplicativo /app/bin/adv-br-aplicativo
      - install -Dm755 ui/adv-br-assinador /app/bin/adv-br-assinador
      - install -Dm755 ui/adv-br-serie /app/bin/adv-br-serie
      - install -Dm755 ui/adv-br-remoteid /app/bin/adv-br-remoteid
      - install -Dm644 ui/preparar-drivers.sh
        /app/share/adv-br-ui/preparar-drivers.sh
      - install -Dm644 ui/registro.sh /app/share/adv-br-ui/registro.sh
      # A versão vai junto: um relato de erro sem ela obriga a perguntar.
      - install -Dm644 VERSAO /app/share/adv-br-ui/VERSAO
      # O intermediário que a cadeia da Softplan não serve; ver o
      # catálogo. Um certificado público, que completa a verificação em
      # vez de desligá-la.
      - install -Dm644 packaging/ca/ThawteTLSRSACAG1.pem
        /app/share/adv-br-ui/ca/ThawteTLSRSACAG1.pem
      - install -Dm644 ui/dev.lukakuuhaku.AdvBr.svg
        /app/share/icons/hicolor/scalable/apps/dev.lukakuuhaku.AdvBr.svg
      - install -Dm644 dev.lukakuuhaku.AdvBr.desktop
        /app/share/applications/dev.lukakuuhaku.AdvBr.desktop
      - install -Dm644 dev.lukakuuhaku.AdvBr.metainfo.xml
        /app/share/metainfo/dev.lukakuuhaku.AdvBr.metainfo.xml
    sources:
      - type: dir
        path: .
